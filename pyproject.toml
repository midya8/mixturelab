[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mixturelab"
version = "0.2.0"
description = "Manual constrained Gaussian-mixture EM with objective identities and real holdout density audits"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6"]
license = "MIT"
[project.scripts]
mixturelab = "mixturelab.__main__:main"
[tool.setuptools.package-data]
mixturelab = ["data/*", "artifacts/*"]
[tool.setuptools.packages.find]
include = ["mixturelab*"]
namespaces = false
